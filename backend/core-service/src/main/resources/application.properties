spring.application.name=core-service
server.port=8082

# PostgreSQL & Flyway
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:25432}/flashsale
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.secret=${JWT_SECRET:flash-sale-super-secure-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Razorpay Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_flashsaleKey123}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:flashsaleSecretKey456}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:flashsaleWebhookSecret789}

